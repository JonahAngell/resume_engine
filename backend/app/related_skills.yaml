# Related skills used to place a missing keyword on a resume line.
# How to add a cluster, alias, phrase, or combination: docs/related-skills.md
#
# Authoring rules learned from related_skills.py (keep these in mind when editing):
#   * Text is lowercased. .NET, node.js (and other Name.js tools), and the language R are
#     kept whole before other punctuation becomes a space.
#     ".NET" -> "dotnet", "ASP.NET" -> "asp dotnet", "node.js" -> "nodejs", "R" -> "r",
#     "R&D" -> "rnd". Other punctuation still splits: "A/B testing" -> "a b testing",
#     "S-Log3" -> "s log3", "scikit-learn" -> "scikit learn".
#   * There is no stemming. "pipeline" does not match "pipelines" and "recruiting" does not
#     match "recruited". Use a single-word alias (dashboards: dashboard) or list both forms.
#   * Single-word aliases are applied word-by-word to ALL text and to cluster terms.
#     Because "hr: human resources" exists, "hr business partner" is stored as
#     "human resources business partner". Alias VALUES are not re-aliased, so they must be
#     written in that fully expanded form (hrbp: human resources business partner).
#   * Avoid bare common English words as names (rest, go, red, avid, resolve, premiere,
#     slider, net, lean, a, it). They create false matches. Use a phrase instead.
#   * A term may sit in more than one cluster when it genuinely bridges two concepts.

